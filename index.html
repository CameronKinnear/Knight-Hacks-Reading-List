<!DOCTYPE html>
<html>
    <head>
        <!-- CSS Files -->
        <link rel="stylesheet" href="styles/global.css">
        <link rel="stylesheet" href="styles/header_footer.css">
        <link rel="stylesheet" href="styles/main.css">
        <link rel="stylesheet" href="styles/list.css">

        <!-- Javascript Files -->
        <script src="scripts/item.js" defer></script>
        <script src="scripts/helper.js" defer></script>
    </head>
    <body>
        <!-- Header Div -->
        <header id="header-box">

        </header>

        <!-- Main Content -->
        <main>
            <!-- The main div for storing user list items -->
            <div id="list-box" class="flex-col">
                <div class="list-item flex-col" data-mode="normal">

                    <!-- Top of item box-->
                    <div class="list-item-top-box flex-row">
                        <div class="list-item-top-left-box flex full-center">
                            <button class="item-button list-item-number full-center flex" onclick="SelectItem(this)">#</button>
                        </div>

                        <div class="list-item-top-right-box">
                            <h1 class="list-item-name left-center-text">Name</h1>
                        </div>
                    </div>

                    <!-- Bottom of item box -->
                    <div class="list-item-bot-box flex-row">
                        <div class="list-item-bot-left-box">

                        </div>

                        <div class="list-item-bot-right-box">
                            <p class="list-item-desc">Desc</p>
                        </div>
                    </div>

                </div>
            </div>
            <button id="add-new-item-button" class="item-button" onclick="AddNewItem()">

            </button>
        </main>

        <!-- Footer Div -->
        <footer id="footer-box">

        </footer>
    </body>
</html>
